<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Money module prototype</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
  section { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
  input, select, textarea, button { font-size: 1rem; padding: .4rem; margin: .25rem 0; }
  input, textarea { width: 100%; box-sizing: border-box; }
  .ok { color: #0a6b2a; } .err { color: #b00020; }
  table { border-collapse: collapse; margin-top: .5rem; }
  th, td { border: 1px solid #ccc; padding: .3rem .7rem; text-align: left; }
  .hint { color: #555; font-size: .85rem; }
</style>
</head>
<body>
<h1>Money module prototype</h1>
<p class="hint">Zero-dependency demo of <code>src/shared/money</code> (integer minor units, deterministic splits).</p>

<section>
  <h2>1. Parse &amp; format</h2>
  <label>Currency
    <select id="currencySel">
      <option>USD</option><option>EUR</option><option>GBP</option><option>JPY</option>
    </select>
  </label>
  <input id="amountInput" value="10.00" placeholder="e.g. 1,234.56">
  <button id="parseBtn">Parse → format</button>
  <p id="parseOut" class="hint">Shows minor units and formatted amount, or the validation error.</p>
</section>

<section>
  <h2>2. Split an expense</h2>
  <input id="splitAmount" value="10.00" placeholder="Total, e.g. 10.00">
  <textarea id="membersInput" rows="4">ali
bo
cara</textarea>
  <div>
    <button id="splitBtn">Split</button>
    <button id="presetBtn">$10.00 ÷ 3 preset</button>
  </div>
  <div id="splitOut"></div>
</section>

<script src="./app.js"></script>
</body>
</html>
