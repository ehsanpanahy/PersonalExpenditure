openapi: 3.1.0
info:
  title: PersonalExpenditure API
  version: 0.2.0
  description: >-
    Go application API. Supabase Auth owns user credentials and sessions;
    authenticated requests use Supabase access tokens and Postgres RLS.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      operationId: healthCheck
      summary: Check whether the API process is running
      responses:
        '200':
          description: API process is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
  /v1/me:
    get:
      operationId: getCurrentUser
      summary: Return the authenticated user's verified ID
      security:
        - supabaseBearer: []
      responses:
        '200':
          description: Verified current user
          content:
            application/json:
              schema:
                type: object
                required: [user_id]
                properties:
                  user_id:
                    type: string
                    format: uuid
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/IdentityProviderUnavailable'
  /v1/expenses:
    get:
      operationId: listPersonalExpenses
      summary: List the authenticated user's personal expenses
      description: >-
        Returns non-deleted personal expenses within explicit inclusive date
        bounds. Shared expenses are excluded. Results are ordered newest first.
      security:
        - supabaseBearer: []
      parameters:
        - name: from
          in: query
          required: true
          description: Inclusive start date; compute month boundaries in the user's IANA timezone.
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          description: Inclusive end date; compute month boundaries in the user's IANA timezone.
          schema:
            type: string
            format: date
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 10000
            default: 0
      responses:
        '200':
          description: Personal expenses; amount_minor is encoded as a decimal string to preserve bigint precision.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PersonalExpense'
        '400':
          description: Invalid or missing date range or pagination parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/IdentityProviderUnavailable'
        '403':
          description: The request is not permitted by Supabase
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Supabase or PostgreSQL data service failed or returned an invalid response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createExpense
      summary: Record a personal or shared expense
      description: >-
        Go validates the application rules and writes the expense and frozen
        splits in one Postgres transaction under the verified caller's RLS
        context. Postgres independently enforces row access and the exact
        split-total integrity invariant; invalid requests are rejected, never
        corrected. The expense author is always the authenticated caller;
        `paid_by` and split members are validated as period members by Go. The
        id is client-generated: retrying with the same id and
        identical payload returns the same id (201); the same id with a
        different payload is a 409 conflict.
      security:
        - supabaseBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExpenseRequest'
      responses:
        '201':
          description: Expense recorded (or idempotent replay confirmed); returns the expense id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateExpenseResult'
        '400':
          description: Invalid expense payload, or the RPC rejected it (split total, dates, membership, currency)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/IdentityProviderUnavailable'
        '403':
          description: The caller may not record into this scope (not a member, period unavailable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The client-generated id already exists with a different payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request body too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Supabase or PostgreSQL data service failed or returned an invalid response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    supabaseBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    PersonalExpense:
      type: object
      required: [id, amount_minor, currency, occurred_on, created_at]
      properties:
        id:
          type: string
          format: uuid
        amount_minor:
          type: string
          pattern: '^[0-9]+$'
          description: Integer minor units represented as a string to preserve bigint precision.
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        occurred_on:
          type: string
          format: date
        category_id:
          type: [string, 'null']
          format: uuid
        note:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
    CreateExpenseSplit:
      type: object
      required: [user_id, amount_minor]
      additionalProperties: false
      properties:
        user_id:
          type: string
          format: uuid
          description: Split participant; must be a member of the period for shared expenses.
        amount_minor:
          type: string
          pattern: '^[0-9]+$'
          description: Frozen share in integer minor units, as a string to preserve bigint precision. Excluded members get no entry, never a zero share.
    CreateExpenseRequest:
      type: object
      required: [id, paid_by, amount_minor, currency, occurred_on, splits]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Client-generated expense id for idempotent create and offline replay.
        period_id:
          type: [string, 'null']
          format: uuid
          description: Null for a personal expense; set for a shared expense in that period.
        category_id:
          type: [string, 'null']
          format: uuid
          description: Required for personal expenses (owned category); must be null for shared expenses.
        paid_by:
          type: string
          format: uuid
          description: Who fronted the money. Equals the caller for personal expenses; a period member for shared expenses.
        amount_minor:
          type: string
          pattern: '^[0-9]+$'
          description: Expense total in integer minor units, as a string to preserve bigint precision. Must be greater than zero and fit in Postgres bigint.
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        occurred_on:
          type: string
          format: date
          description: Accounting date; must not be in the future (in the author's time zone) and must fall within the period for shared expenses.
        note:
          type: [string, 'null']
        splits:
          type: array
          minItems: 1
          maxItems: 200
          description: Frozen shares. Exactly one entry (the caller, full amount) for personal expenses; one positive entry per participant for shared expenses. Entries must total exactly amount_minor.
          items:
            $ref: '#/components/schemas/CreateExpenseSplit'
    CreateExpenseResult:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
  responses:
    Unauthorized:
      description: Missing, invalid, or expired Supabase access token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    IdentityProviderUnavailable:
      description: Supabase Auth could not validate the token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
